[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-bi"
version = "0.1.0"
description = "Validated retail profitability analytics pipeline for the Kaggle Superstore dataset"
requires-python = ">=3.13"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "duckdb>=1.1,<3",
  "pyarrow>=18,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["retail_bi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
